[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extract vendor, number, date and amounts from PDF invoices into Excel or CSV, and flag the ones a person should check."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.10", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "reportlab>=4"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
